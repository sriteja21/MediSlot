AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot Flask doctor portal served directly by Nginx over HTTPS on EC2.
  Gunicorn remains bound to localhost and administration uses Systems Manager.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance size for the Flask application.

  AppArtifactKey:
    Type: String
    Description: Versioned key of the Flask application ZIP in the reports bucket.

Resources:
  MediSlotInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permit Nginx traffic only from the MediSlot load balancer.
      VpcId:
        Fn::ImportValue: !Sub "MediSlot-VpcId-${Environment}"
      SecurityGroupIngress:
        - Description: HTTP access only to redirect clients to HTTPS.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Public HTTPS access to the MediSlot portal.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Allow package downloads and AWS API access during bootstrap.
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Portal-Instance-SG-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "MediSlot-Portal-InstanceRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: !Sub "MediSlot-ReadPortalArtifact-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "${ReportsBucketArn}/ec2-app/*"
                    - ReportsBucketArn:
                        Fn::ImportValue: !Sub "MediSlot-ReportsBucketArn-${Environment}"
        - PolicyName: !Sub "MediSlot-SignalPortalBootstrap-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SignalCurrentPortalStack
                Effect: Allow
                Action:
                  - cloudformation:SignalResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
        - PolicyName: !Sub "MediSlot-InvokeSlotMaterialiser-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeSlotMaterialiser
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:MediSlot-SlotMaterialiser-${Environment}"
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Portal-InstanceRole-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "MediSlot-Portal-InstanceProfile-${Environment}"
      Roles:
        - !Ref MediSlotInstanceRole

  MediSlotApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref MediSlotInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId:
            Fn::ImportValue: !Sub "MediSlot-PublicSubnetId-${Environment}"
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref MediSlotInstanceSecurityGroup
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -Eeuo pipefail
              exec > >(tee -a /var/log/medislot-bootstrap.log /dev/console) 2>&1
              STACK_NAME='${AWS::StackName}'
              AWS_REGION='${AWS::Region}'
              INSTANCE_ID=bootstrap-unknown
              signal_failure() {
                  STATUS=$?
                  aws cloudformation signal-resource \
                      --stack-name "$STACK_NAME" \
                      --logical-resource-id MediSlotApplicationInstance \
                      --unique-id "$INSTANCE_ID" \
                      --status FAILURE \
                      --region "$AWS_REGION" || true
                  exit "$STATUS"
              }
              trap signal_failure ERR
              dnf install -y awscli openssl python3.11 python3.11-pip nginx unzip
              TOKEN=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token \
                -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
              INSTANCE_ID=$(curl -fsS -H "X-aws-ec2-metadata-token: $TOKEN" \
                http://169.254.169.254/latest/meta-data/instance-id)
              mkdir -p /opt/medislot/app /etc/medislot
              mkdir -p /etc/pki/tls/private /etc/pki/tls/certs
              PORTAL_IP='${PortalIp}'
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /etc/pki/tls/private/medislot-portal.key \
                -out /etc/pki/tls/certs/medislot-portal.crt \
                -subj "/CN=MediSlot Portal" \
                -addext "subjectAltName=IP:$PORTAL_IP"
              chmod 600 /etc/pki/tls/private/medislot-portal.key
              aws s3 cp "s3://${ReportsBucket}/${AppArtifactKey}" /tmp/medislot-app.zip
              unzip -q /tmp/medislot-app.zip -d /opt/medislot/app
              python3.11 -m venv /opt/medislot/venv
              /opt/medislot/venv/bin/pip install --upgrade pip
              /opt/medislot/venv/bin/pip install -r /opt/medislot/app/requirements.txt
              FLASK_SECRET=$(openssl rand -hex 32)
              printf 'API_BASE_URL=%s\nAWS_REGION=%s\nSECRET_KEY=%s\nCOOKIE_SECURE=true\n' '${ApiBaseUrl}' '${AWS::Region}' "$FLASK_SECRET" > /etc/medislot/app.env
              unset FLASK_SECRET
              chmod 600 /etc/medislot/app.env
              cat > /etc/systemd/system/medislot.service <<'SERVICE'
              [Unit]
              Description=MediSlot Flask portal
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=ec2-user
              Group=ec2-user
              WorkingDirectory=/opt/medislot/app
              EnvironmentFile=/etc/medislot/app.env
              ExecStart=/opt/medislot/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 app:app
              Restart=on-failure
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              SERVICE
              cat > /etc/nginx/conf.d/medislot.conf <<'NGINX'
                server {
                  listen 80 default_server;
                  server_name _;
                  return 301 https://$host$request_uri;
                }

              server {
                  listen 443 ssl default_server;
                  server_name _;
                  ssl_certificate /etc/pki/tls/certs/medislot-portal.crt;
                  ssl_certificate_key /etc/pki/tls/private/medislot-portal.key;
                  ssl_protocols TLSv1.2 TLSv1.3;

                  location / {
                      proxy_pass http://127.0.0.1:8000;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                  }
              }
              NGINX
              rm -f /etc/nginx/conf.d/default.conf
              chown -R ec2-user:ec2-user /opt/medislot
              cat > /etc/systemd/system/medislot-slot-materialiser.service <<'SERVICE'
              [Unit]
              Description=Refresh MediSlot rolling appointment slots
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/aws lambda invoke --function-name '${MaterialiserFunctionName}' --region '${AWS::Region}' --invocation-type Event --cli-binary-format raw-in-base64-out --payload '{}' /dev/null
              SERVICE
              cat > /etc/systemd/system/medislot-slot-materialiser.timer <<'TIMER'
              [Unit]
              Description=Daily MediSlot slot materialisation

              [Timer]
              OnCalendar=*-*-* 00:15:00 UTC
              Persistent=true
              RandomizedDelaySec=300
              Unit=medislot-slot-materialiser.service

              [Install]
              WantedBy=timers.target
              TIMER
              systemctl daemon-reload
              systemctl enable --now amazon-ssm-agent medislot nginx
              systemctl enable --now medislot-slot-materialiser.timer
              systemctl start --no-block medislot-slot-materialiser.service
                nginx -t
                systemctl is-active --quiet medislot
                systemctl is-active --quiet nginx
                curl -kfsS https://127.0.0.1/healthz > /dev/null
                aws cloudformation signal-resource \
                  --stack-name "$STACK_NAME" \
                  --logical-resource-id MediSlotApplicationInstance \
                  --unique-id "$INSTANCE_ID" \
                  --status SUCCESS \
                  --region "$AWS_REGION"
                trap - ERR
            - ReportsBucket:
                Fn::ImportValue: !Sub "MediSlot-ReportsBucketName-${Environment}"
              AppArtifactKey: !Ref AppArtifactKey
              PortalIp:
                Fn::ImportValue: !Sub "MediSlot-PortalElasticIp-${Environment}"
              ApiBaseUrl:
                Fn::ImportValue: !Sub "MediSlot-ApiUrl-${Environment}"
              MaterialiserFunctionName: !Sub "MediSlot-SlotMaterialiser-${Environment}"
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Portal-Instance-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M

  MediSlotApplicationElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId:
        Fn::ImportValue: !Sub "MediSlot-PortalElasticIpAllocationId-${Environment}"
      InstanceId: !Ref MediSlotApplicationInstance

Outputs:
  ApplicationUrl:
    Description: HTTPS address of the MediSlot EC2 portal. TLS certificate must include this IP address.
    Value: !Sub
      - "https://${PortalIp}"
      - PortalIp:
          Fn::ImportValue: !Sub "MediSlot-PortalElasticIp-${Environment}"
    Export:
      Name: !Sub "MediSlot-PortalUrl-${Environment}"

  ApplicationInstanceId:
    Description: EC2 instance running the Flask portal.
    Value: !Ref MediSlotApplicationInstance
