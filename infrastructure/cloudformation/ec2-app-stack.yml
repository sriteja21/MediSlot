AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot Flask doctor portal served directly by Nginx over HTTPS on EC2.
  Gunicorn remains bound to localhost and administration uses Systems Manager.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance size for the Flask application.

  AppArtifactKey:
    Type: String
    Description: Versioned key of the Flask application ZIP in the reports bucket.

  FlaskSecretParameterName:
    Type: String
    Default: /MediSlot/dev/ec2-app/flask-secret
    Description: SSM SecureString parameter name for Flask session signing.

  TlsCertificateParameterName:
    Type: String
    Default: /MediSlot/dev/ec2-app/tls-certificate
    Description: SSM SecureString parameter name containing the TLS certificate PEM.

  TlsPrivateKeyParameterName:
    Type: String
    Default: /MediSlot/dev/ec2-app/tls-private-key
    Description: SSM SecureString parameter name containing the TLS private key PEM.

Resources:
  MediSlotInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permit Nginx traffic only from the MediSlot load balancer.
      VpcId:
        Fn::ImportValue: !Sub "MediSlot-VpcId-${Environment}"
      SecurityGroupIngress:
        - Description: Public HTTPS access to the MediSlot portal.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Allow package downloads and AWS API access during bootstrap.
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Portal-Instance-SG-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "MediSlot-Portal-InstanceRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: !Sub "MediSlot-ReadPortalArtifact-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "${ReportsBucketArn}/ec2-app/*"
                    - ReportsBucketArn:
                        Fn::ImportValue: !Sub "MediSlot-ReportsBucketArn-${Environment}"
        - PolicyName: !Sub "MediSlot-ReadRuntimeParameters-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadFlaskAndTlsParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FlaskSecretParameterName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TlsCertificateParameterName}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TlsPrivateKeyParameterName}"
              - Sid: DecryptSecureParametersThroughSsm
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Portal-InstanceRole-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "MediSlot-Portal-InstanceProfile-${Environment}"
      Roles:
        - !Ref MediSlotInstanceRole

  MediSlotApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref MediSlotInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId:
            Fn::ImportValue: !Sub "MediSlot-PublicSubnetId-${Environment}"
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref MediSlotInstanceSecurityGroup
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              dnf install -y awscli python3.11 python3.11-pip nginx unzip
              mkdir -p /opt/medislot/app /etc/medislot
              aws s3 cp "s3://${ReportsBucket}/${AppArtifactKey}" /tmp/medislot-app.zip
              unzip -q /tmp/medislot-app.zip -d /opt/medislot/app
              python3.11 -m venv /opt/medislot/venv
              /opt/medislot/venv/bin/pip install --upgrade pip
              /opt/medislot/venv/bin/pip install -r /opt/medislot/app/requirements.txt
              mkdir -p /etc/pki/tls/private /etc/pki/tls/certs
              aws ssm get-parameter --name '${TlsCertificateParameterName}' --with-decryption --query Parameter.Value --output text > /etc/pki/tls/certs/medislot-portal.crt
              aws ssm get-parameter --name '${TlsPrivateKeyParameterName}' --with-decryption --query Parameter.Value --output text > /etc/pki/tls/private/medislot-portal.key
              chmod 600 /etc/pki/tls/private/medislot-portal.key /etc/pki/tls/certs/medislot-portal.crt
              printf 'API_BASE_URL=%s\nAWS_REGION=%s\nFLASK_SECRET_PARAMETER_NAME=%s\nCOOKIE_SECURE=true\n' '${ApiBaseUrl}' '${AWS::Region}' '${FlaskSecretParameterName}' > /etc/medislot/app.env
              chmod 600 /etc/medislot/app.env
              cat > /etc/systemd/system/medislot.service <<'SERVICE'
              [Unit]
              Description=MediSlot Flask portal
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=ec2-user
              Group=ec2-user
              WorkingDirectory=/opt/medislot/app
              EnvironmentFile=/etc/medislot/app.env
              ExecStart=/opt/medislot/venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 app:app
              Restart=on-failure
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              SERVICE
              cat > /etc/nginx/conf.d/medislot.conf <<'NGINX'
              server {
                  listen 443 ssl default_server;
                  server_name _;
                  ssl_certificate /etc/pki/tls/certs/medislot-portal.crt;
                  ssl_certificate_key /etc/pki/tls/private/medislot-portal.key;
                  ssl_protocols TLSv1.2 TLSv1.3;

                  location / {
                      proxy_pass http://127.0.0.1:8000;
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                  }
              }
              NGINX
              rm -f /etc/nginx/conf.d/default.conf
              chown -R ec2-user:ec2-user /opt/medislot
              systemctl daemon-reload
              systemctl enable --now amazon-ssm-agent medislot nginx
            - ReportsBucket:
                Fn::ImportValue: !Sub "MediSlot-ReportsBucketName-${Environment}"
              AppArtifactKey: !Ref AppArtifactKey
              FlaskSecretParameterName: !Ref FlaskSecretParameterName
              TlsCertificateParameterName: !Ref TlsCertificateParameterName
              TlsPrivateKeyParameterName: !Ref TlsPrivateKeyParameterName
              ApiBaseUrl:
                Fn::ImportValue: !Sub "MediSlot-ApiUrl-${Environment}"
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Portal-Instance-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

    MediSlotApplicationElasticIpAssociation:
      Type: AWS::EC2::EIPAssociation
      Properties:
        AllocationId:
          Fn::ImportValue: !Sub "MediSlot-PortalElasticIpAllocationId-${Environment}"
        InstanceId: !Ref MediSlotApplicationInstance

Outputs:
  ApplicationUrl:
      Description: HTTPS address of the MediSlot EC2 portal. TLS certificate must include this IP address.
    Value: !Sub
      - "https://${PortalIp}"
      - PortalIp:
          Fn::ImportValue: !Sub "MediSlot-PortalElasticIp-${Environment}"
    Export:
      Name: !Sub "MediSlot-PortalUrl-${Environment}"

  ApplicationInstanceId:
    Description: EC2 instance running the Flask portal.
    Value: !Ref MediSlotApplicationInstance
