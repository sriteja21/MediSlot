AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot data infrastructure. Creates private RDS MySQL, six
  DynamoDB tables, and two private S3 buckets. Uses the naming
  convention MediSlot-Resource-Environment wherever supported.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment.

  Region:
    Type: String
    Default: ap-south-1
    Description: AWS region in which this stack is deployed.

  DBMasterUsername:
    Type: String
    Default: medislot_admin
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    Description: RDS MySQL administrator username.

  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41
    Description: >
      RDS administrator password. CloudFormation stores it in SSM as a
      String parameter for this temporary development configuration.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t4g.micro
      - db.t4g.small
    Description: RDS MySQL instance class.

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: RDS allocated storage in GiB.

  DBBackupRetentionPeriod:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35
    Description: Number of days to retain automated database backups.

  DynamoDBBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
    Description: DynamoDB billing mode.

# ============================================================
# RULES
# ============================================================

Rules:

  RegionMustMatchStackRegion:
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref Region
            - !Ref AWS::Region
        AssertDescription: >
          The Region parameter must match the region where the
          CloudFormation stack is deployed.

# ============================================================
# CONDITIONS
# ============================================================

Conditions:

  IsProduction:
    Fn::Equals:
      - !Ref Environment
      - prod

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # RDS SUBNET GROUP
  # ==========================================================

  MediSlotDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Private subnet group for MediSlot RDS"
      DBSubnetGroupName: !Sub "MediSlot-DBSubnetGroup-${Environment}"

      SubnetIds:
        - Fn::ImportValue:
            !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
        - Fn::ImportValue:
            !Sub "MediSlot-PrivateSubnet2Id-${Environment}"

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-DBSubnetGroup-${Environment}"
        - Key: Project
          Value: "MediSlot"
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # RDS MYSQL DATABASE
  # ==========================================================

  MediSlotDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "medislot-database-${Environment}"
      Engine: mysql
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true

      MasterUsername: !Ref DBMasterUsername

      MasterUserPassword: !Ref DBMasterPassword

      DBName: medislot
      Port: 3306

      DBSubnetGroupName: !Ref MediSlotDBSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub "MediSlot-RDSSecurityGroupId-${Environment}"

      PubliclyAccessible: false
      MultiAZ: !If
        - IsProduction
        - true
        - false

      BackupRetentionPeriod: !Ref DBBackupRetentionPeriod
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports:
        - error
        - general
        - slowquery

      DeletionProtection: !If
        - IsProduction
        - true
        - false

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Database-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Sensitive

  # ==========================================================
  # DYNAMODB TABLE 1: SLOTS
  # ==========================================================

  # Holds materialized appointment slots.
  # doctor_id and slot_sk (<start epoch>#<consultation type>) are the primary key.
  # is_active is an item attribute; blackout or obsolete unbooked slots are retained inactive.

  MediSlotSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MediSlot-Slots-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode

      AttributeDefinitions:
        - AttributeName: doctor_id
          AttributeType: S
        - AttributeName: slot_sk
          AttributeType: S
        - AttributeName: consultation_type_id
          AttributeType: S
        - AttributeName: start_time
          AttributeType: S

      KeySchema:
        - AttributeName: doctor_id
          KeyType: HASH
        - AttributeName: slot_sk
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: gsi_type_time
          KeySchema:
            - AttributeName: consultation_type_id
              KeyType: HASH
            - AttributeName: start_time
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi_doctor_time
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
            - AttributeName: start_time
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Slots-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # DYNAMODB TABLE 2: IDEMPOTENCY KEYS
  # ==========================================================

  # Prevents duplicate appointment creation when a request is retried.

  MediSlotIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MediSlot-Idempotency-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode

      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: scope_key
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: scope_key
          KeyType: RANGE

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Idempotency-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # DYNAMODB TABLE 3: WAITLIST
  # ==========================================================

  # Slot queue with patient lookup and join-order indexes.

  MediSlotWaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MediSlot-Waitlist-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode

      AttributeDefinitions:
        - AttributeName: slot_ref
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: joined_at
          AttributeType: S
        - AttributeName: slot_start
          AttributeType: S

      KeySchema:
        - AttributeName: slot_ref
          KeyType: HASH
        - AttributeName: patient_id
          KeyType: RANGE

      LocalSecondaryIndexes:
        - IndexName: lsi_queue
          KeySchema:
            - AttributeName: slot_ref
              KeyType: HASH
            - AttributeName: joined_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      GlobalSecondaryIndexes:
        - IndexName: gsi_patient
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
            - AttributeName: slot_start
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Waitlist-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # DYNAMODB TABLE 4: WAITLIST OFFER
  # ==========================================================

  # Temporary seat offers to waiting patients.

  MediSlotWaitlistOfferTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MediSlot-WaitlistOffer-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode

      AttributeDefinitions:
        - AttributeName: slot_ref
          AttributeType: S
        - AttributeName: patient_id
          AttributeType: S
        - AttributeName: expires_at
          AttributeType: N
        - AttributeName: live_shard
          AttributeType: S

      KeySchema:
        - AttributeName: slot_ref
          KeyType: HASH
        - AttributeName: patient_id
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: gsi_patient_offer
          KeySchema:
            - AttributeName: patient_id
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi_live
          KeySchema:
            - AttributeName: live_shard
              KeyType: HASH
            - AttributeName: expires_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-WaitlistOffer-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # DYNAMODB TABLE 5: REFRESH TOKENS
  # ==========================================================

  # Stores session IDs and SHA-256 hashes of refresh-token secrets.
  # The raw refresh token must never be stored.

  MediSlotRefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MediSlot-RefreshTokens-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode

      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: N

      KeySchema:
        - AttributeName: session_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: gsi_user
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-RefreshTokens-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Sensitive

  # ==========================================================
  # DYNAMODB TABLE 6: NOTIFICATIONS
  # ==========================================================

  # Notification history with a sparse retry index for unsent items.

  MediSlotNotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "MediSlot-Notifications-${Environment}"
      BillingMode: !Ref DynamoDBBillingMode

      AttributeDefinitions:
        - AttributeName: recipient_user_id
          AttributeType: S
        - AttributeName: notification_id
          AttributeType: S
        - AttributeName: retry_shard
          AttributeType: S
        - AttributeName: next_attempt_at
          AttributeType: N

      KeySchema:
        - AttributeName: recipient_user_id
          KeyType: HASH
        - AttributeName: notification_id
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: gsi_retry
          KeySchema:
            - AttributeName: retry_shard
              KeyType: HASH
            - AttributeName: next_attempt_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Notifications-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # S3 BUCKET 1: PROFILE PHOTOS
  # ==========================================================

  # S3 bucket names must be lowercase and globally unique.
  # The account ID prevents collisions between AWS accounts.

  MediSlotProfilePhotosBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub
        - "medislot-profile-photos-${AccountId}-${Environment}-${Region}"
        - AccountId: !Ref AWS::AccountId
          Environment: !Ref Environment
          Region: !Ref Region

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedOrigins:
              - Fn::Sub:
                  - "https://${PortalIp}"
                  - PortalIp:
                      Fn::ImportValue: !Sub "MediSlot-PortalElasticIp-${Environment}"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-ProfilePhotos-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # S3 BUCKET 2: REPORTS AND EXPORTS
  # ==========================================================

  MediSlotReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub
        - "medislot-reports-${AccountId}-${Environment}-${Region}"
        - AccountId: !Ref AWS::AccountId
          Environment: !Ref Environment
          Region: !Ref Region

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: !Sub "MediSlot-Reports-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DatabaseEndpoint:
    Description: Private RDS MySQL endpoint.
    Value: !GetAtt MediSlotDatabase.Endpoint.Address
    Export:
      Name: !Sub "MediSlot-DatabaseEndpoint-${Environment}"

  DatabasePort:
    Description: RDS MySQL port.
    Value: !GetAtt MediSlotDatabase.Endpoint.Port
    Export:
      Name: !Sub "MediSlot-DatabasePort-${Environment}"

  DatabaseName:
    Description: RDS database name.
    Value: medislot
    Export:
      Name: !Sub "MediSlot-DatabaseName-${Environment}"

  DatabaseSubnetGroup:
    Description: RDS subnet group name.
    Value: !Ref MediSlotDBSubnetGroup

  SlotsTableName:
    Description: DynamoDB slots table.
    Value: !Ref MediSlotSlotsTable
    Export:
      Name: !Sub "MediSlot-SlotsTableName-${Environment}"

  IdempotencyTableName:
    Description: DynamoDB idempotency table.
    Value: !Ref MediSlotIdempotencyTable
    Export:
      Name: !Sub "MediSlot-IdempotencyTableName-${Environment}"

  WaitlistTableName:
    Description: DynamoDB waitlist table.
    Value: !Ref MediSlotWaitlistTable
    Export:
      Name: !Sub "MediSlot-WaitlistTableName-${Environment}"

  WaitlistOfferTableName:
    Description: DynamoDB waitlist offer table.
    Value: !Ref MediSlotWaitlistOfferTable
    Export:
      Name: !Sub "MediSlot-WaitlistOfferTableName-${Environment}"

  RefreshTokensTableName:
    Description: DynamoDB refresh tokens table.
    Value: !Ref MediSlotRefreshTokensTable
    Export:
      Name: !Sub "MediSlot-RefreshTokensTableName-${Environment}"

  NotificationsTableName:
    Description: DynamoDB notifications table.
    Value: !Ref MediSlotNotificationsTable
    Export:
      Name: !Sub "MediSlot-NotificationsTableName-${Environment}"

  ProfilePhotosBucketName:
    Description: Private S3 bucket for doctor profile photos.
    Value: !Ref MediSlotProfilePhotosBucket
    Export:
      Name: !Sub "MediSlot-ProfilePhotosBucketName-${Environment}"

  ReportsBucketName:
    Description: Private S3 bucket for reports and exports.
    Value: !Ref MediSlotReportsBucket
    Export:
      Name: !Sub "MediSlot-ReportsBucketName-${Environment}"

  RefreshTokensTableArn:
    Description: DynamoDB refresh tokens table ARN for IAM policies.
    Value: !GetAtt MediSlotRefreshTokensTable.Arn
    Export:
      Name: !Sub "MediSlot-RefreshTokensTableArn-${Environment}"

  SlotsTableArn:
    Description: DynamoDB slots table ARN for IAM policies.
    Value: !GetAtt MediSlotSlotsTable.Arn
    Export:
      Name: !Sub "MediSlot-SlotsTableArn-${Environment}"

  IdempotencyTableArn:
    Description: DynamoDB idempotency table ARN for IAM policies.
    Value: !GetAtt MediSlotIdempotencyTable.Arn
    Export:
      Name: !Sub "MediSlot-IdempotencyTableArn-${Environment}"

  WaitlistTableArn:
    Description: DynamoDB waitlist table ARN for IAM policies.
    Value: !GetAtt MediSlotWaitlistTable.Arn
    Export:
      Name: !Sub "MediSlot-WaitlistTableArn-${Environment}"

  WaitlistOfferTableArn:
    Description: DynamoDB waitlist offer table ARN for IAM policies.
    Value: !GetAtt MediSlotWaitlistOfferTable.Arn
    Export:
      Name: !Sub "MediSlot-WaitlistOfferTableArn-${Environment}"

  NotificationsTableArn:
    Description: DynamoDB notifications table ARN for IAM policies.
    Value: !GetAtt MediSlotNotificationsTable.Arn
    Export:
      Name: !Sub "MediSlot-NotificationsTableArn-${Environment}"

  ProfilePhotosBucketArn:
    Description: Profile photos bucket ARN for IAM policies.
    Value: !GetAtt MediSlotProfilePhotosBucket.Arn
    Export:
      Name: !Sub "MediSlot-ProfilePhotosBucketArn-${Environment}"

  ReportsBucketArn:
    Description: Reports bucket ARN for IAM policies.
    Value: !GetAtt MediSlotReportsBucket.Arn
    Export:
      Name: !Sub "MediSlot-ReportsBucketArn-${Environment}"

  DeploymentRegion:
    Description: AWS region configured for this stack.
    Value: !Ref Region