AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  MediSlot application stack.
  Creates the shared Python Lambda Layer, API Gateway, authentication and
  authorization Lambdas, doctor API, and scheduled slot materializer.
  Uses existing Network, Data, and IAM stack exports.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Description: Deployment environment.
    AllowedValues:
      - dev
      - test
      - prod
    Default: dev

  JWTSecretParameterName:
    Type: String
    Description: >
      Name of the SSM SecureString parameter containing the JWT signing secret.
    Default: /MediSlot/dev/auth/jwt-secret

  DatabaseCredentialsParameterName:
    Type: String
    Description: >
      Name of the SSM parameter containing the database credentials.
    Default: /MediSlot/dev/database/application-credentials

# ============================================================
# GLOBAL LAMBDA CONFIGURATION
# ============================================================

Globals:

  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active

    # The shared layer (src/shared) is attached to every function in this
    # stack, so handlers can use: from shared.config import ...
    Layers:
      - !Ref SharedPythonLayer

    Environment:
      Variables:

        ENVIRONMENT: !Ref Environment

        JWT_SECRET_PARAMETER_NAME: !Ref JWTSecretParameterName

        DATABASE_CREDENTIALS_PARAMETER_NAME: !Ref DatabaseCredentialsParameterName

        # ----------------------------------------------------
        # RDS CONFIGURATION
        # Imported from the existing Data stack.
        # ----------------------------------------------------

        DB_HOST:
          Fn::ImportValue:
            !Sub "MediSlot-DatabaseEndpoint-${Environment}"

        DB_PORT:
          Fn::ImportValue:
            !Sub "MediSlot-DatabasePort-${Environment}"

        DB_NAME:
          Fn::ImportValue:
            !Sub "MediSlot-DatabaseName-${Environment}"

        # ----------------------------------------------------
        # DYNAMODB CONFIGURATION
        # Imported from the existing Data stack.
        # ----------------------------------------------------

        REFRESH_TOKENS_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-RefreshTokensTableName-${Environment}"

        # ----------------------------------------------------
        # OTHER EXISTING TABLES
        # Passed as environment variables for compatibility with the
        # existing project configuration. No tables are created here.
        # ----------------------------------------------------

        SLOTS_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-SlotsTableName-${Environment}"

        IDEMPOTENCY_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-IdempotencyTableName-${Environment}"

        WAITLIST_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-WaitlistTableName-${Environment}"

        WAITLIST_OFFER_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-WaitlistOfferTableName-${Environment}"

        NOTIFICATIONS_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-NotificationsTableName-${Environment}"

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # SHARED PYTHON LAMBDA LAYER
  #
  # Source of truth: src/shared/
  # The GitHub Actions workflow generates the layer package at
  # <repo-root>/.build/lambda-layers/shared-python/python/shared/
  # before sam validate / sam build / sam deploy run.
  #
  # Lambda mounts layers at /opt, and /opt/python is on the
  # Python path, so handlers import it as:  import shared
  # ==========================================================

  SharedPythonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "medislot-shared-python-${Environment}"
      Description: !Sub "Shared Python modules for MediSlot Lambda functions (${Environment})."
      ContentUri: ../../.build/lambda-layers/shared-python/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Retain

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  MediSlotApi:
    Type: AWS::Serverless::Api

    Properties:

      Name: !Sub "MediSlot-API-${Environment}"

      StageName: !Ref Environment

      EndpointConfiguration: REGIONAL

      TracingEnabled: true

      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

      # All routes require JWT authorization by default.
      # Public authentication routes explicitly disable the
      # authorizer in their event definitions.

      Auth:
        DefaultAuthorizer: MediSlotJwtAuthorizer

        Authorizers:

          MediSlotJwtAuthorizer:

            FunctionArn: !GetAtt MediSlotAuthorizerFunction.Arn

            FunctionPayloadType: TOKEN

            Identity:
              Header: Authorization
              ReauthorizeEvery: 0

  # ==========================================================
  # AUTHENTICATION LAMBDA
  #
  # Responsibilities:
  # - Doctor / patient registration
  # - Doctor / patient / generic login
  # - Refresh access tokens
  # - Logout
  #
  # Uses the existing Authentication Lambda IAM role.
  # Shared modules come from SharedPythonLayer (see Globals).
  # ==========================================================

  MediSlotAuthFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub "MediSlot-AuthFunction-${Environment}"

      Description: !Sub >
        MediSlot authentication operations for the ${Environment} environment.

      CodeUri: ../../src/auth/

      Handler: handler.lambda_handler

      Runtime: python3.12

      Timeout: 30

      MemorySize: 256

      Role:
        Fn::ImportValue:
          !Sub "MediSlot-AuthLambdaRoleArn-${Environment}"

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"

        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"

          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"

      Events:

        # ----------------------------------------------------
        # PUBLIC ROUTES
        # No JWT is required to register or log in.
        # ----------------------------------------------------

        DoctorRegistration:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/doctors/register
            Method: POST
            Auth:
              Authorizer: NONE

        PatientRegistration:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/patients/register
            Method: POST
            Auth:
              Authorizer: NONE

        RegistrationOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/registration-options
            Method: GET
            Auth:
              Authorizer: NONE

        DoctorLogin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/doctors/login
            Method: POST
            Auth:
              Authorizer: NONE

        PatientLogin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/patients/login
            Method: POST
            Auth:
              Authorizer: NONE

        GenericLogin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

        RefreshToken:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE

        # ----------------------------------------------------
        # PROTECTED ROUTE
        # Logout requires a valid access token.
        # ----------------------------------------------------

        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/logout
            Method: POST

  # ==========================================================
  # AUTHORIZATION LAMBDA
  #
  # Responsibilities:
  # - Validate JWT access tokens
  # - Check token expiration and revocation
  # - Validate role claims
  # - Return Allow or Deny IAM policies
  #
  # Intentionally outside the VPC.
  # Shared modules come from SharedPythonLayer (see Globals).
  # ==========================================================

  MediSlotAuthorizerFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub "MediSlot-AuthorizerFunction-${Environment}"

      Description: !Sub >
        MediSlot JWT authorization for the ${Environment} environment.

      CodeUri: ../../src/authorizer/

      Handler: authorizer.lambda_handler

      Runtime: python3.12

      Timeout: 10

      MemorySize: 256

      Role:
        Fn::ImportValue:
          !Sub "MediSlot-AuthorizerLambdaRoleArn-${Environment}"

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          JWT_SECRET_PARAMETER_NAME: !Ref JWTSecretParameterName

          REFRESH_TOKENS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-RefreshTokensTableName-${Environment}"

  # ==========================================================
  # DOCTOR BUSINESS API
  # ==========================================================

  MediSlotDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-DoctorFunction-${Environment}"
      Description: !Sub "MediSlot doctor profile and schedule API (${Environment})."
      CodeUri: ../../src/doctor/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 512
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          PROFILE_PHOTO_BUCKET:
            Fn::ImportValue:
              !Sub "MediSlot-ProfilePhotosBucketName-${Environment}"
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsTableName-${Environment}"
          SLOT_MATERIALISER_FUNCTION_NAME: !Sub "MediSlot-SlotMaterialiser-${Environment}"
      Events:
        DoctorProfileGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me
            Method: GET
        DoctorProfilePatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me
            Method: PATCH
        DoctorPhotoUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/photo-upload-url
            Method: GET
        ConsultationTypesGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types
            Method: GET
        ConsultationTypesPost:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types
            Method: POST
        ConsultationTypePatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types/{id}
            Method: PATCH
        ConsultationTypeDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types/{id}
            Method: DELETE
        AvailabilityGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability
            Method: GET
        AvailabilityPost:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability
            Method: POST
        AvailabilityDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability/{id}
            Method: DELETE
        AvailabilityPatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability/{id}
            Method: PATCH
        BlackoutsGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/blackouts
            Method: GET
        BlackoutsPost:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/blackouts
            Method: POST
        BlackoutDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/blackouts/{id}
            Method: DELETE
        DoctorScheduleGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/schedule
            Method: GET
        DoctorDashboardGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/dashboard
            Method: GET

  MediSlotPatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-PatientFunction-${Environment}"
      Description: !Sub "MediSlot patient dashboard API (${Environment})."
      CodeUri: ../../src/patient/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Events:
        PatientDashboardGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/dashboard
            Method: GET

  # ==========================================================
  # DAILY SLOT MATERIALISER
  # ==========================================================

  MediSlotSlotMaterialiserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-SlotMaterialiser-${Environment}"
      Description: !Sub "Materializes the rolling MediSlot appointment window (${Environment})."
      CodeUri: ../../src/slot_materialiser/
      Handler: handler.lambda_handler
      Timeout: 900
      MemorySize: 512
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsTableName-${Environment}"

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # SHARED LAYER
  # ----------------------------------------------------------

  SharedPythonLayerArn:
    Description: ARN of the shared Python Lambda Layer version.
    Value: !Ref SharedPythonLayer

    Export:
      Name: !Sub "MediSlot-SharedPythonLayerArn-${Environment}"

  # ----------------------------------------------------------
  # API GATEWAY
  # ----------------------------------------------------------

  MediSlotApiId:
    Description: ID of the MediSlot API Gateway.
    Value: !Ref MediSlotApi

    Export:
      Name: !Sub "MediSlot-ApiId-${Environment}"

  MediSlotApiUrl:
    Description: Base URL of the MediSlot API Gateway.
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"
      - ApiId: !Ref MediSlotApi

    Export:
      Name: !Sub "MediSlot-ApiUrl-${Environment}"

  # ----------------------------------------------------------
  # AUTHENTICATION LAMBDA
  # ----------------------------------------------------------

  MediSlotAuthFunctionArn:
    Description: ARN of the MediSlot Authentication Lambda.
    Value: !GetAtt MediSlotAuthFunction.Arn

    Export:
      Name: !Sub "MediSlot-AuthFunctionArn-${Environment}"

  # ----------------------------------------------------------
  # AUTHORIZATION LAMBDA
  # ----------------------------------------------------------

  MediSlotAuthorizerFunctionArn:
    Description: ARN of the MediSlot Authorization Lambda.
    Value: !GetAtt MediSlotAuthorizerFunction.Arn

    Export:
      Name: !Sub "MediSlot-AuthorizerFunctionArn-${Environment}"