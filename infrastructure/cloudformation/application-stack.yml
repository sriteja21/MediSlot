AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  MediSlot application stack.
  Creates the shared Python Lambda Layer, API Gateway, authentication and
  authorization Lambdas, doctor API, and scheduled slot materializer.
  Uses existing Network, Data, and IAM stack exports.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Description: Deployment environment.
    AllowedValues:
      - dev
      - test
      - prod
    Default: dev

  JWTSecretParameterName:
    Type: String
    Description: >
      Name of the SSM SecureString parameter containing the JWT signing secret.
    Default: /MediSlot/dev/auth/jwt-secret

  DatabaseCredentialsParameterName:
    Type: String
    Description: >
      Name of the SSM parameter containing the database credentials.
    Default: /MediSlot/dev/database/application-credentials

  SESFromEmail:
    Type: String
    Description: Verified SES sender address used for patient and doctor email.
    Default: ""

  EnableFaultInjection:
    Type: String
    Description: Enables only test fault injection for reschedule compensation tests.
    AllowedValues: ["true", "false"]
    Default: "false"

  RefundPolicyJson:
    Type: String
    Description: JSON refund policy shared by patient and doctor cancellation flows.
    Default: '{"tiers":[{"minimum_hours":48,"refund_percent":100,"inclusive":false,"name":"more_than_48_hours"},{"minimum_hours":24,"refund_percent":75,"inclusive":false,"name":"24_to_48_hours"},{"minimum_hours":6,"refund_percent":50,"inclusive":false,"name":"6_to_24_hours"},{"minimum_hours":0,"refund_percent":0,"inclusive":true,"name":"less_than_6_hours"}],"doctor_refund_percent":100,"no_show_refund_percent":0}'

# ============================================================
# GLOBAL LAMBDA CONFIGURATION
# ============================================================

Globals:

  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active

    # The shared layer (src/shared) is attached to every function in this
    # stack, so handlers can use: from shared.config import ...
    Layers:
      - !Ref SharedPythonLayer

    Environment:
      Variables:

        ENVIRONMENT: !Ref Environment

        JWT_SECRET_PARAMETER_NAME: !Ref JWTSecretParameterName

        DATABASE_CREDENTIALS_PARAMETER_NAME: !Ref DatabaseCredentialsParameterName
        REFUND_POLICY_PARAMETER_NAME: !Sub "/MediSlot/${Environment}/booking/refund-policy"
        # ----------------------------------------------------
        # RDS CONFIGURATION
        # Imported from the existing Data stack.
        # ----------------------------------------------------

        DB_HOST:
          Fn::ImportValue:
            !Sub "MediSlot-DatabaseEndpoint-${Environment}"

        DB_PORT:
          Fn::ImportValue:
            !Sub "MediSlot-DatabasePort-${Environment}"

        DB_NAME:
          Fn::ImportValue:
            !Sub "MediSlot-DatabaseName-${Environment}"

        # ----------------------------------------------------
        # DYNAMODB CONFIGURATION
        # Imported from the existing Data stack.
        # ----------------------------------------------------

        REFRESH_TOKENS_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-RefreshTokensTableName-${Environment}"

        # ----------------------------------------------------
        # OTHER EXISTING TABLES
        # Passed as environment variables for compatibility with the
        # existing project configuration. No tables are created here.
        # ----------------------------------------------------

        SLOTS_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-SlotsV2TableName-${Environment}"

        IDEMPOTENCY_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-IdempotencyTableName-${Environment}"

        WAITLIST_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-WaitlistTableName-${Environment}"
        WAITLIST_OFFER_TABLE:
          Fn::ImportValue:
            !Sub "MediSlot-WaitlistOfferTableName-${Environment}"

        EVENT_BUS_NAME: !Ref MediSlotEventBus

# ============================================================
# RESOURCES
# ============================================================

Resources:

  RefundPolicyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/MediSlot/${Environment}/booking/refund-policy"
      Type: String
      Value: !Ref RefundPolicyJson
      Description: Shared MediSlot cancellation refund tiers.
      Tags:
        Project: MediSlot
        Environment: !Ref Environment

  # ==========================================================
  # SHARED PYTHON LAMBDA LAYER
  #
  # Sources of truth: src/shared/ and src/read_api/service.py
  # The GitHub Actions workflow generates the layer package at
  # <repo-root>/.build/lambda-layers/shared-python/python/shared/
  # before sam validate / sam build / sam deploy run.
  #
  # Lambda mounts layers at /opt, and /opt/python is on the
  # Python path, so handlers import it as:  import shared
  # ==========================================================

  SharedPythonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "medislot-shared-python-${Environment}"
      Description: !Sub "Shared Python modules for MediSlot Lambda functions (${Environment})."
      ContentUri: ../../.build/lambda-layers/shared-python/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Retain

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  MediSlotApi:
    Type: AWS::Serverless::Api

    Properties:

      Name: !Sub "MediSlot-API-${Environment}"

      StageName: !Ref Environment

      EndpointConfiguration: REGIONAL

      TracingEnabled: true

      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

      # All routes require JWT authorization by default.
      # Public authentication routes explicitly disable the
      # authorizer in their event definitions.

      Auth:
        DefaultAuthorizer: MediSlotJwtAuthorizer

        Authorizers:

          MediSlotJwtAuthorizer:

            FunctionArn: !GetAtt MediSlotAuthorizerFunction.Arn

            FunctionPayloadType: TOKEN

            Identity:
              Header: Authorization
              ReauthorizeEvery: 0

  # ==========================================================
  # AUTHENTICATION LAMBDA
  #
  # Responsibilities:
  # - Doctor / patient registration
  # - Doctor / patient / generic login
  # - Refresh access tokens
  # - Logout
  #
  # Uses the existing Authentication Lambda IAM role.
  # Shared modules come from SharedPythonLayer (see Globals).
  # ==========================================================

  MediSlotAuthFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub "MediSlot-AuthFunction-${Environment}"

      Description: !Sub >
        MediSlot authentication operations for the ${Environment} environment.

      CodeUri: ../../src/auth/

      Handler: handler.lambda_handler

      Runtime: python3.12

      Timeout: 30

      MemorySize: 256

      Role:
        Fn::ImportValue:
          !Sub "MediSlot-AuthLambdaRoleArn-${Environment}"

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"

        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"

          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"

      Events:

        # ----------------------------------------------------
        # PUBLIC ROUTES
        # No JWT is required to register or log in.
        # ----------------------------------------------------

        DoctorRegistration:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/doctors/register
            Method: POST
            Auth:
              Authorizer: NONE

        PatientRegistration:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/patients/register
            Method: POST
            Auth:
              Authorizer: NONE

        RegistrationOptions:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/registration-options
            Method: GET
            Auth:
              Authorizer: NONE

        DoctorLogin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/doctors/login
            Method: POST
            Auth:
              Authorizer: NONE

        PatientLogin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/patients/login
            Method: POST
            Auth:
              Authorizer: NONE

        GenericLogin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

        RefreshToken:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE

        # ----------------------------------------------------
        # PROTECTED ROUTE
        # Logout requires a valid access token.
        # ----------------------------------------------------

        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /auth/logout
            Method: POST

  # ==========================================================
  # AUTHORIZATION LAMBDA
  #
  # Responsibilities:
  # - Validate JWT access tokens
  # - Check token expiration and revocation
  # - Validate role claims
  # - Return Allow or Deny IAM policies
  #
  # Intentionally outside the VPC.
  # Shared modules come from SharedPythonLayer (see Globals).
  # ==========================================================

  MediSlotAuthorizerFunction:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub "MediSlot-AuthorizerFunction-${Environment}"

      Description: !Sub >
        MediSlot JWT authorization for the ${Environment} environment.

      CodeUri: ../../src/authorizer/

      Handler: authorizer.lambda_handler

      Runtime: python3.12

      Timeout: 10

      MemorySize: 256

      Role:
        Fn::ImportValue:
          !Sub "MediSlot-AuthorizerLambdaRoleArn-${Environment}"

      Environment:
        Variables:

          ENVIRONMENT: !Ref Environment

          JWT_SECRET_PARAMETER_NAME: !Ref JWTSecretParameterName

          REFRESH_TOKENS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-RefreshTokensTableName-${Environment}"

  # ==========================================================
  # SHARED READ API
  # ==========================================================

  MediSlotReadApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-ReadApiFunction-${Environment}"
      Description: !Sub "Shared doctor and patient read API (${Environment})."
      CodeUri: ../../src/read_api/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 512
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Events:
        SlotsGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /slots
            Method: GET
        DoctorConsultationTypesGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types
            Method: GET
        PatientDoctorProfileGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/doctors/{doctor_id}
            Method: GET

  # ==========================================================
  # DOCTOR BUSINESS API
  # ==========================================================

  MediSlotDoctorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-DoctorFunction-${Environment}"
      Description: !Sub "MediSlot doctor profile and configuration API (${Environment})."
      CodeUri: ../../src/doctor/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 512
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          PROFILE_PHOTO_BUCKET:
            Fn::ImportValue:
              !Sub "MediSlot-ProfilePhotosBucketName-${Environment}"
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          SLOT_MATERIALISER_FUNCTION_NAME: !Sub "MediSlot-SlotMaterialiser-${Environment}"
      Events:
        DoctorProfileGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me
            Method: GET
        DoctorProfilePatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me
            Method: PATCH
        DoctorPhotoUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/photo-upload-url
            Method: GET
        ConsultationTypesPost:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types
            Method: POST
        ConsultationTypePatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types/{id}
            Method: PATCH
        ConsultationTypeDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/consultation-types/{id}
            Method: DELETE
        AvailabilityGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability
            Method: GET
        AvailabilityPost:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability
            Method: POST
        AvailabilityDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability/{id}
            Method: DELETE
        AvailabilityPatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/availability/{id}
            Method: PATCH
        BlackoutsGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/blackouts
            Method: GET
        BlackoutsPost:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/blackouts
            Method: POST
        BlackoutDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/blackouts/{id}
            Method: DELETE
        DoctorDashboardGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/dashboard
            Method: GET
        DoctorPaymentsGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/payments
            Method: GET
        DoctorRefundsGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/refunds
            Method: GET

  MediSlotBookingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MediSlot-Booking-${Environment}-dlq.fifo"
      FifoQueue: true
      SqsManagedSseEnabled: true
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600

  MediSlotBookingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MediSlot-Booking-${Environment}.fifo"
      FifoQueue: true
      SqsManagedSseEnabled: true
      VisibilityTimeout: 360
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MediSlotBookingDeadLetterQueue.Arn
        maxReceiveCount: 5

  MediSlotBookingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref MediSlotBookingQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPatientApiToEnqueueBookings
            Effect: Allow
            Principal:
              AWS:
                Fn::ImportValue:
                  !Sub "MediSlot-PatientLambdaRoleArn-${Environment}"
            Action: sqs:SendMessage
            Resource: !GetAtt MediSlotBookingQueue.Arn

  MediSlotBookingWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/MediSlot-BookingWorker-${Environment}"
      RetentionInDays: 14

  MediSlotPatientFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-PatientFunction-${Environment}"
      Description: !Sub "MediSlot patient dashboard API (${Environment})."
      CodeUri: ../../src/patient/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-PatientLambdaRoleArn-${Environment}"
      Environment:
        Variables:
          BOOKING_QUEUE_URL: !Ref MediSlotBookingQueue
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Events:
        PatientProfileGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me
            Method: GET
        PatientProfilePatch:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me
            Method: PATCH
        PatientProfileDelete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me
            Method: DELETE
        PatientDashboardGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/dashboard
            Method: GET
        PatientDoctorSearchGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/doctors/search
            Method: GET
        PatientDoctorSearchOptionsGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/doctors/search-options
            Method: GET
        PatientAppointmentCreate:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/appointments
            Method: POST
        PatientBookingRequestStatus:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/booking-requests/{request_id}
            Method: GET
        PatientWaitlistGet:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/waitlists
            Method: GET
        PatientWaitlistJoin:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/waitlists
            Method: POST
        PatientWaitlistLeave:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/waitlists
            Method: DELETE
        PatientWaitlistAccept:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/waitlist-offers/{offer_id}/accept
            Method: POST
        PatientRefundPreview:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/appointments/{appointment_id}/refund-preview
            Method: GET
        LegacyWaitlistOfferCleanup:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  MediSlotBookingWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "MediSlot-BookingWorkerRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
      Policies:
        - PolicyName: !Sub "MediSlot-BookingWorkerLogs-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MediSlot-BookingWorker-${Environment}"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MediSlot-BookingWorker-${Environment}:*"
        - PolicyName: !Sub "MediSlot-BookingWorkerTracing-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
        - PolicyName: !Sub "MediSlot-BookingWorkerQueue-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt MediSlotBookingQueue.Arn
                  - !GetAtt MediSlotBookingDeadLetterQueue.Arn
        - PolicyName: !Sub "MediSlot-BookingWorkerDatabase-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabaseCredentialsParameterName}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.${AWS::URLSuffix}"
        - PolicyName: !Sub "MediSlot-BookingWorkerSlots-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::ImportValue:
                    !Sub "MediSlot-SlotsV2TableArn-${Environment}"
        - PolicyName: !Sub "MediSlot-BookingWorkerIdempotency-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::ImportValue:
                    !Sub "MediSlot-IdempotencyTableArn-${Environment}"
        - PolicyName: !Sub "MediSlot-BookingWorkerPublishNotifications-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt MediSlotEventBus.Arn
      Tags:
        - Key: Name
          Value: !Sub "MediSlot-BookingWorkerRole-${Environment}"
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  MediSlotBookingWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-BookingWorker-${Environment}"
      Description: !Sub "Processes booking requests from the FIFO queue (${Environment})."
      CodeUri: ../../src/booking_worker/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 512
      Role: !GetAtt MediSlotBookingWorkerRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          IDEMPOTENCY_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-IdempotencyTableName-${Environment}"
          EVENT_BUS_NAME: !Ref MediSlotEventBus
      Events:
        BookingQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt MediSlotBookingQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  MediSlotBookingDlqProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/MediSlot-BookingDlqProcessor-${Environment}"
      RetentionInDays: 14

  MediSlotBookingDlqProcessor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-BookingDlqProcessor-${Environment}"
      CodeUri: ../../src/booking_worker/
      Handler: dlq_handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt MediSlotBookingWorkerRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          IDEMPOTENCY_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-IdempotencyTableName-${Environment}"
      Events:
        BookingDlq:
          Type: SQS
          Properties:
            Queue: !GetAtt MediSlotBookingDeadLetterQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  MediSlotAppointmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-Appointment-${Environment}"
      Description: !Sub "Owns appointment cancel, complete and no-show transitions (${Environment})."
      CodeUri: ../../src/appointment/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          REFUND_POLICY_PARAMETER_NAME: !Sub "/MediSlot/${Environment}/booking/refund-policy"
          RESCHEDULE_STATE_MACHINE_ARN: !Ref MediSlotRescheduleStateMachine
          EVENT_BUS_NAME: !Ref MediSlotEventBus
      Events:
        PatientReschedule:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/appointments/{appointment_id}/reschedule
            Method: POST
        PatientCancel:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /patients/me/appointments/{appointment_id}/cancel
            Method: POST
        DoctorCancel:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/appointments/{appointment_id}/cancel
            Method: POST
        DoctorComplete:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/appointments/{appointment_id}/complete
            Method: POST
        DoctorNoShow:
          Type: Api
          Properties:
            RestApiId: !Ref MediSlotApi
            Path: /doctors/me/appointments/{appointment_id}/no-show
            Method: POST

  MediSlotEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "MediSlot-Events-${Environment}"

  NotificationEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MediSlot-NotificationEvents-${Environment}-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  NotificationEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MediSlot-NotificationEvents-${Environment}"
      SqsManagedSseEnabled: true
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationEventsDlq.Arn
        maxReceiveCount: 5

  NotificationRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref MediSlotEventBus
      EventPattern:
        source:
          - prefix: medislot.
        detail-type:
          - AppointmentBooked
          - AppointmentCancelledByPatient
          - AppointmentCancelledByDoctor
          - AppointmentRescheduled
          - WaitlistOfferIssued
          - AppointmentReminder24h
          - AppointmentReminder2h
          - AppointmentNoShow
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationEventsQueue.Arn

  NotificationEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationEventsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt NotificationRule.Arn

  WaitlistEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MediSlot-WaitlistEvents-${Environment}-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  WaitlistEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "MediSlot-WaitlistEvents-${Environment}"
      SqsManagedSseEnabled: true
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WaitlistEventsDlq.Arn
        maxReceiveCount: 5

  WaitlistRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref MediSlotEventBus
      EventPattern:
        source:
          - medislot.waitlist
        detail-type:
          - SlotSeatFreed
          - WaitlistOfferExpired
      Targets:
        - Id: waitlist-queue
          Arn: !GetAtt WaitlistEventsQueue.Arn

  WaitlistEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref WaitlistEventsQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt WaitlistEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt WaitlistRule.Arn

  MediSlotWaitlistPromoter:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-WaitlistPromoter-${Environment}"
      CodeUri: ../../src/waitlist_promoter/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          WAITLIST_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-WaitlistTableName-${Environment}"
          WAITLIST_OFFER_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-WaitlistOfferTableName-${Environment}"
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          EVENT_BUS_NAME: !Ref MediSlotEventBus
      Events:
        WaitlistEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt WaitlistEventsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  MediSlotWaitlistSweeper:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-WaitlistSweeper-${Environment}"
      CodeUri: ../../src/waitlist_sweeper/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          WAITLIST_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-WaitlistTableName-${Environment}"
          WAITLIST_OFFER_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-WaitlistOfferTableName-${Environment}"
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          EVENT_BUS_NAME: !Ref MediSlotEventBus
      Events:
        EveryMinute:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)

  BookingDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "MediSlot-BookingDlq-${Environment}"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MediSlotBookingDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  NotificationDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "MediSlot-NotificationDlq-${Environment}"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationEventsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  WaitlistDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "MediSlot-WaitlistDlq-${Environment}"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WaitlistEventsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  MediSlotNotificationDispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/MediSlot-NotificationDispatcher-${Environment}"
      RetentionInDays: 14

  MediSlotNotificationDispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "MediSlot-NotificationDispatcherRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "MediSlot-NotificationDispatcherLogs-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MediSlot-NotificationDispatcher-${Environment}"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/MediSlot-NotificationDispatcher-${Environment}:*"
        - PolicyName: !Sub "MediSlot-NotificationDispatcherTracing-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
        - PolicyName: !Sub "MediSlot-NotificationDispatcherQueue-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt NotificationEventsQueue.Arn
        - PolicyName: !Sub "MediSlot-NotificationDispatcherTable-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  Fn::ImportValue:
                    !Sub "MediSlot-NotificationsTableArn-${Environment}"
        - PolicyName: !Sub "MediSlot-NotificationDispatcherEmail-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"

  MediSlotNotificationDispatcher:
    Type: AWS::Serverless::Function
    DependsOn:
      - MediSlotNotificationDispatcherLogGroup
    Properties:
      FunctionName: !Sub "MediSlot-NotificationDispatcher-${Environment}"
      Description: !Sub "Persists and delivers queued patient and doctor email notifications (${Environment})."
      CodeUri: ../../src/notification_dispatcher/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt MediSlotNotificationDispatcherRole.Arn
      Environment:
        Variables:
          NOTIFICATIONS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-NotificationsTableName-${Environment}"
          SES_FROM_EMAIL: !Ref SESFromEmail
      Events:
        NotificationQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationEventsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ==========================================================
  # DAILY SLOT MATERIALISER
  # ==========================================================

  MediSlotRescheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-Reschedule-${Environment}"
      CodeUri: ../../src/reschedule/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          ENABLE_FAULT_INJECTION: !Ref EnableFaultInjection
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
          WAITLIST_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-WaitlistTableName-${Environment}"
          WAITLIST_OFFER_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-WaitlistOfferTableName-${Environment}"
          EVENT_BUS_NAME: !Ref MediSlotEventBus

  MediSlotRescheduleStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "MediSlot-Reschedule-${Environment}"
      Type: STANDARD
      Tracing:
        Enabled: true
      DefinitionUri: ../../statemachine/reschedule.asl.json
      DefinitionSubstitutions:
        RescheduleFunctionArn: !GetAtt MediSlotRescheduleFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref MediSlotRescheduleFunction

  MediSlotReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-Reminder-${Environment}"
      CodeUri: ../../src/reminder/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 256
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref MediSlotEventBus
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)

  MediSlotSlotMaterialiserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "MediSlot-SlotMaterialiser-${Environment}"
      Description: !Sub "Materializes the rolling MediSlot appointment window (${Environment})."
      CodeUri: ../../src/slot_materialiser/
      Handler: handler.lambda_handler
      Timeout: 900
      MemorySize: 512
      Role:
        Fn::ImportValue:
          !Sub "MediSlot-ApiLambdaRoleArn-${Environment}"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "MediSlot-LambdaSecurityGroupId-${Environment}"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet1Id-${Environment}"
          - Fn::ImportValue:
              !Sub "MediSlot-PrivateSubnet2Id-${Environment}"
      Environment:
        Variables:
          SLOTS_TABLE:
            Fn::ImportValue:
              !Sub "MediSlot-SlotsV2TableName-${Environment}"
      Events:
        DailyRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 18 * * ? *)
            Input: '{}'

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # SHARED LAYER
  # ----------------------------------------------------------

  SharedPythonLayerArn:
    Description: ARN of the shared Python Lambda Layer version.
    Value: !Ref SharedPythonLayer

    Export:
      Name: !Sub "MediSlot-SharedPythonLayerArn-${Environment}"

  # ----------------------------------------------------------
  # API GATEWAY
  # ----------------------------------------------------------

  MediSlotApiId:
    Description: ID of the MediSlot API Gateway.
    Value: !Ref MediSlotApi

    Export:
      Name: !Sub "MediSlot-ApiId-${Environment}"

  MediSlotApiUrl:
    Description: Base URL of the MediSlot API Gateway.
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"
      - ApiId: !Ref MediSlotApi

    Export:
      Name: !Sub "MediSlot-ApiUrl-${Environment}"

  # ----------------------------------------------------------
  # AUTHENTICATION LAMBDA
  # ----------------------------------------------------------

  MediSlotAuthFunctionArn:
    Description: ARN of the MediSlot Authentication Lambda.
    Value: !GetAtt MediSlotAuthFunction.Arn

    Export:
      Name: !Sub "MediSlot-AuthFunctionArn-${Environment}"

  # ----------------------------------------------------------
  # AUTHORIZATION LAMBDA
  # ----------------------------------------------------------

  MediSlotAuthorizerFunctionArn:
    Description: ARN of the MediSlot Authorization Lambda.
    Value: !GetAtt MediSlotAuthorizerFunction.Arn

    Export:
      Name: !Sub "MediSlot-AuthorizerFunctionArn-${Environment}"