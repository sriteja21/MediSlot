<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MediSlot | Clinical Schedule Management{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div style="position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999; max-width: 420px; width: calc(100% - 3rem);">
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="alert alert-{{ category if category in ['danger', 'success', 'warning', 'info'] else 'info' }}">
              <span>{{ message }}</span>
              <button type="button" class="alert-close" onclick="this.closest('.alert').remove()">&times;</button>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
