{% extends "base.html" %}

{% block content %}
<div class="app-wrapper patient-page">
  {% include "patient/_sidebar.html" %}
  <main class="main-content patient-main-content">
    <div class="patient-content">
      <div id="patientNotice" class="patient-notice" role="status" aria-live="polite" hidden></div>
      {% block page_content %}{% endblock %}
    </div>
  </main>
</div>
<dialog class="patient-dialog" id="appointmentDetailsDialog" aria-labelledby="appointmentDetailsTitle">
  <div class="patient-dialog-header">
    <div>
      <p class="patient-eyebrow">VISIT DETAILS</p>
      <h2 id="appointmentDetailsTitle">Appointment</h2>
    </div>
    <button type="button" class="patient-dialog-close" data-close-dialog aria-label="Close dialog">&times;</button>
  </div>
  <div class="patient-dialog-body" id="appointmentDetailsBody"></div>
  <div class="patient-dialog-footer">
    <button type="button" class="btn btn-secondary" data-close-dialog>Close</button>
  </div>
</dialog>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/patient.js', v='20261124') }}" defer></script>
{% endblock %}
