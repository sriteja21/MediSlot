
name: MediSlot Infrastructure CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "MediSlot deployment environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  PROJECT_NAME: MediSlot

  NETWORK_TEMPLATE: infrastructure/cloudformation/network-stack.yml
  DATA_TEMPLATE: infrastructure/cloudformation/data-stack.yml
  IAM_TEMPLATE: infrastructure/cloudformation/iam-stack.yml
  INIT_TEMPLATE: infrastructure/cloudformation/init-stack.yml
  APPLICATION_TEMPLATE: infrastructure/cloudformation/application-stack.yml

# ============================================================
# VALIDATE ALL TEMPLATES
# ============================================================

jobs:

  validate:
    name: Validate MediSlot Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint aws-sam-cli

      - name: Check template files
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            "$NETWORK_TEMPLATE" \
            "$DATA_TEMPLATE" \
            "$IAM_TEMPLATE" \
            "$INIT_TEMPLATE" \
            "$APPLICATION_TEMPLATE"
          do
            if [ ! -f "$template" ]; then
              echo "::error::Template not found: $template"
              exit 1
            fi

            echo "Found: $template"
          done

      - name: Validate CloudFormation templates
        shell: bash
        run: |
          set -euo pipefail

          for template in \
            "$NETWORK_TEMPLATE" \
            "$DATA_TEMPLATE" \
            "$IAM_TEMPLATE" \
            "$INIT_TEMPLATE" \
            "$APPLICATION_TEMPLATE"
          do
            echo "========================================"
            echo "Validating $template"
            echo "========================================"

            cfn-lint "$template" --ignore-checks W
          done

      - name: Validate Database Initializer SAM template
        run: |
          sam validate \
            --template-file "$INIT_TEMPLATE" \
            --region "$AWS_REGION"

      - name: Prepare shared Python Lambda Layer
        shell: bash
        run: |
          set -euo pipefail
          LAYER_SOURCE="src/shared"
          LAYER_ROOT=".build/lambda-layers/shared-python"
          LAYER_PYTHON_DIR="${LAYER_ROOT}/python"

          test -f "${LAYER_SOURCE}/__init__.py"
          test -f "${LAYER_SOURCE}/config.py"
          test -f "${LAYER_SOURCE}/database.py"
          test -f "${LAYER_SOURCE}/logging_utils.py"

          rm -rf "${LAYER_ROOT}"
          mkdir -p "${LAYER_PYTHON_DIR}"
          cp -R "${LAYER_SOURCE}" "${LAYER_PYTHON_DIR}/shared"

          echo "Prepared Lambda Layer from ${LAYER_SOURCE}:"
          find "${LAYER_PYTHON_DIR}/shared" -maxdepth 1 -type f -print
          test -f "${LAYER_PYTHON_DIR}/shared/__init__.py"

      - name: Validate Authentication and Authorization SAM template
        run: |
          sam validate \
            --template-file "$APPLICATION_TEMPLATE" \
            --region "$AWS_REGION"

# ============================================================
# DEPLOY NETWORK STACK
# ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: validate

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Network Stack
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-Network-${ENVIRONMENT}"

          aws cloudformation deploy \
            --template-file "$NETWORK_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

# ============================================================
# DEPLOY DATA STACK
# ============================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Data Stack
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-Data-${ENVIRONMENT}"

          aws cloudformation deploy \
            --template-file "$DATA_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

# ============================================================
# DEPLOY IAM STACK
# ============================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy IAM Stack
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-IAM-${ENVIRONMENT}"

          JWT_SECRET_PARAMETER_NAME="/MediSlot/${ENVIRONMENT}/auth/jwt-secret"
          DATABASE_CREDENTIALS_PARAMETER_NAME="/MediSlot/${ENVIRONMENT}/database/application-credentials"

          aws cloudformation deploy \
            --template-file "$IAM_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              Region="$AWS_REGION" \
              JWTSecretParameterName="$JWT_SECRET_PARAMETER_NAME" \
              DatabaseCredentialsParameterName="$DATABASE_CREDENTIALS_PARAMETER_NAME"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

# ============================================================
# BUILD DATABASE INITIALIZER
# ============================================================

  build-database-initializer:
    name: Build Database Initializer
    runs-on: ubuntu-latest
    needs: deploy-iam

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        run: |
          python -m pip install --upgrade pip
          pip install aws-sam-cli

      - name: Build Database Initializer
        run: |
          sam build \
            --template-file "$INIT_TEMPLATE" \
            --region "$AWS_REGION"

      - name: Upload built initializer artifact
        uses: actions/upload-artifact@v4
        with:
          name: medislot-database-initializer
          path: .aws-sam/build/
          if-no-files-found: error
          retention-days: 1

# ============================================================
# DEPLOY DATABASE INITIALIZER
# ============================================================

  deploy-database-initializer:
    name: Deploy Database Initializer
    runs-on: ubuntu-latest
    needs: build-database-initializer

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built initializer artifact
        uses: actions/download-artifact@v4
        with:
          name: medislot-database-initializer
          path: .aws-sam/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Database Initializer
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-DatabaseInitializer-${ENVIRONMENT}"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

# ============================================================
# BUILD AUTHENTICATION AND AUTHORIZATION APPLICATION
# ============================================================

  build-application:
    name: Build Authentication and Authorization
    runs-on: ubuntu-latest
    needs: deploy-database-initializer

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        run: |
          python -m pip install --upgrade pip
          pip install aws-sam-cli

      - name: Prepare shared Python Lambda Layer
        shell: bash
        run: |
          set -euo pipefail
          LAYER_SOURCE="src/shared"
          LAYER_ROOT=".build/lambda-layers/shared-python"
          LAYER_PYTHON_DIR="${LAYER_ROOT}/python"

          test -f "${LAYER_SOURCE}/__init__.py"
          test -f "${LAYER_SOURCE}/config.py"
          test -f "${LAYER_SOURCE}/database.py"
          test -f "${LAYER_SOURCE}/logging_utils.py"

          rm -rf "${LAYER_ROOT}"
          mkdir -p "${LAYER_PYTHON_DIR}"
          cp -R "${LAYER_SOURCE}" "${LAYER_PYTHON_DIR}/shared"

          echo "Prepared Lambda Layer from ${LAYER_SOURCE}:"
          find "${LAYER_PYTHON_DIR}/shared" -maxdepth 1 -type f -print
          test -f "${LAYER_PYTHON_DIR}/shared/__init__.py"

      - name: Build Authentication and Authorization Lambdas
        run: |
          sam build \
            --template-file "$APPLICATION_TEMPLATE" \
            --region "$AWS_REGION"

      - name: Upload built application artifact
        uses: actions/upload-artifact@v4
        with:
          name: medislot-auth-application
          path: .aws-sam/build/
          if-no-files-found: error
          retention-days: 1

# ============================================================
# DEPLOY AUTHENTICATION AND AUTHORIZATION APPLICATION
# ============================================================

  deploy-application:
    name: Deploy Authentication and Authorization
    runs-on: ubuntu-latest
    needs: build-application

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built application artifact
        uses: actions/download-artifact@v4
        with:
          name: medislot-auth-application
          path: .aws-sam/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Authentication and Authorization Stack
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-Application-${ENVIRONMENT}"

          JWT_SECRET_PARAMETER_NAME="/MediSlot/${ENVIRONMENT}/auth/jwt-secret"
          DATABASE_CREDENTIALS_PARAMETER_NAME="/MediSlot/${ENVIRONMENT}/database/application-credentials"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              JWTSecretParameterName="$JWT_SECRET_PARAMETER_NAME" \
              DatabaseCredentialsParameterName="$DATABASE_CREDENTIALS_PARAMETER_NAME"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

# ============================================================
# DEPLOYMENT SUMMARY
# ============================================================

  deployment-summary:
    name: MediSlot Deployment Summary
    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-database-initializer
      - deploy-application

    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')

    steps:
      - name: Display deployment results
        shell: bash
        run: |
          echo "========================================"
          echo "MediSlot Deployment Summary"
          echo "========================================"
          echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "Region: $AWS_REGION"
          echo "Branch: $GITHUB_REF_NAME"
          echo ""
          echo "Network: ${{ needs.deploy-network.result }}"
          echo "Data: ${{ needs.deploy-data.result }}"
          echo "IAM: ${{ needs.deploy-iam.result }}"
          echo "Database Initializer: ${{ needs.deploy-database-initializer.result }}"
          echo "Authentication/Authorization: ${{ needs.deploy-application.result }}"
          echo "========================================"

          if [[ "${{ needs.deploy-network.result }}" != "success" ||
                "${{ needs.deploy-data.result }}" != "success" ||
                "${{ needs.deploy-iam.result }}" != "success" ||
                "${{ needs.deploy-database-initializer.result }}" != "success" ||
                "${{ needs.deploy-application.result }}" != "success" ]]; then
            echo "::error::One or more MediSlot deployment jobs failed or were skipped."
            exit 1
          fi

      - name: List deployed MediSlot stacks
        if: success()
        run: |
          aws sts get-caller-identity

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_COMPLETE UPDATE_COMPLETE \
              UPDATE_ROLLBACK_COMPLETE \
            --query "StackSummaries[?contains(StackName, 'MediSlot')].[StackName,StackStatus]" \
            --output table
