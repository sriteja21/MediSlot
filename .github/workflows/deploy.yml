
name: MediSlot Infrastructure CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "MediSlot deployment environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  PROJECT_NAME: MediSlot

  NETWORK_TEMPLATE: infrastructure/cloudformation/network-stack.yml
  DATA_TEMPLATE: infrastructure/cloudformation/data-stack.yml
  IAM_TEMPLATE: infrastructure/cloudformation/iam-stack.yml
  INIT_TEMPLATE: infrastructure/cloudformation/init-stack.yml

jobs:
  validate:
    name: Validate MediSlot Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint
          pip install aws-sam-cli

      # Ignore cfn-lint warnings.
      - name: Validate CloudFormation templates
        run: |
          set -e

          for template in \
            "$NETWORK_TEMPLATE" \
            "$DATA_TEMPLATE" \
            "$IAM_TEMPLATE" \
            "$INIT_TEMPLATE"
          do
            echo "========================================"
            echo "Validating $template"
            echo "========================================"

            if [ ! -f "$template" ]; then
              echo "ERROR: Template not found: $template"
              exit 1
            fi

            cfn-lint "$template" --ignore-checks W
          done

      - name: Validate Database Initializer SAM Template
        env:
          AWS_DEFAULT_REGION: ap-south-1
          AWS_REGION: ap-south-1
        run: |
          set -e

          sam validate \
            --template-file "$INIT_TEMPLATE" \
            --region ap-south-1

  deploy:
    name: Deploy MediSlot Infrastructure
    runs-on: ubuntu-latest

    needs: validate

    # Deploy on pushes to any branch or on a manual workflow run.
    # Pull requests run validation only.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    # Pushes default to dev.
    # Manual runs use the environment selected by the user.
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Display deployment configuration
        run: |
          echo "Project: $PROJECT_NAME"
          echo "Region: $AWS_REGION"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Check deployment templates
        run: |
          set -e

          for template in \
            "$NETWORK_TEMPLATE" \
            "$DATA_TEMPLATE" \
            "$IAM_TEMPLATE" \
            "$INIT_TEMPLATE"
          do
            if [ ! -f "$template" ]; then
              echo "ERROR: Template not found: $template"
              exit 1
            fi

            echo "Found $template"
          done

      - name: Deploy network stack
        run: |
          set -e

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-Network-${ENVIRONMENT}"

          aws cloudformation deploy \
            --template-file "$NETWORK_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

      - name: Deploy database stack
        run: |
          set -e

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-Data-${ENVIRONMENT}"

          aws cloudformation deploy \
            --template-file "$DATA_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

      - name: Deploy IAM stack
        run: |
          set -e

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-IAM-${ENVIRONMENT}"

          aws cloudformation deploy \
            --template-file "$IAM_TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

      - name: Build Database Initializer
        run: |
          set -e

          sam build \
            --template-file "$INIT_TEMPLATE" \
            --region "$AWS_REGION"

      - name: Deploy Database Initializer
        run: |
          set -e

          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          STACK_NAME="MediSlot-DatabaseInitializer-${ENVIRONMENT}"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT"

      - name: Show deployed MediSlot stacks
        if: success()
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"

          echo "MediSlot deployment completed."
          echo "Environment: $ENVIRONMENT"
          echo "Region: $AWS_REGION"
          echo "Branch: $GITHUB_REF_NAME"

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_COMPLETE UPDATE_COMPLETE \
            --query "StackSummaries[?contains(StackName, 'MediSlot')].[StackName,StackStatus]" \
            --output table
